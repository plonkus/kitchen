[project]
name = "claude-kitchen"
version = "0.1.0"
description = "tmux-based multi-agent orchestration"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "websockets>=13.0",
]

[project.scripts]
kitchen = "claude_kitchen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
