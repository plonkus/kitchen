<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kitchen dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Synopsis text wraps naturally and preserves the loop's line breaks. */
    .synopsis { white-space: pre-wrap; }
    @keyframes pulse-dot { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .live { animation: pulse-dot 2s ease-in-out infinite; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased">
  <div class="mx-auto max-w-3xl px-6 py-10">

    <header class="mb-8 flex items-baseline justify-between gap-4">
      <h1 class="text-2xl font-semibold tracking-tight">kitchen dashboard</h1>
      <p id="counts" class="text-sm text-zinc-400">loading…</p>
    </header>

    <main id="grid" class="space-y-3">
      <p class="text-zinc-500">Connecting…</p>
    </main>

    <section id="dormant-wrap" class="mt-6 hidden">
      <button id="dormant-toggle"
              class="text-sm text-zinc-400 hover:text-zinc-200 transition-colors">
        <span id="dormant-label"></span>
      </button>
      <div id="dormant-list" class="mt-3 space-y-2 hidden"></div>
    </section>

    <footer class="mt-10 border-t border-zinc-800 pt-4 text-xs text-zinc-500 flex items-center justify-between gap-4">
      <span id="status-line">—</span>
      <span class="flex items-center gap-1.5">
        <span id="ws-dot" class="inline-block h-1.5 w-1.5 rounded-full bg-zinc-600"></span>
        <span id="ws-text">offline</span>
      </span>
    </footer>

    <p class="mt-3 text-[11px] text-zinc-600">
      Read-only. Status refreshes every loop tick. Chat: <code class="text-zinc-500">tmux attach -t ck-overview</code>
    </p>
  </div>

  <script>
    const STATUS = {
      waiting_on_you: { icon: "⏳", label: "waiting on you", border: "border-amber-400", text: "text-amber-300", order: 0 },
      working:        { icon: "🔄", label: "working",        border: "border-sky-400",   text: "text-sky-300",   order: 1 },
      booting:        { icon: "🐣", label: "booting",        border: "border-violet-400",text: "text-violet-300",order: 2 },
      idle:           { icon: "💤", label: "idle",           border: "border-zinc-600",  text: "text-zinc-400",  order: 3 },
    };

    let lastState = null;
    let lastFetch = null;

    function elapsed(fromIso) {
      if (!fromIso) return "";
      const secs = Math.max(0, Math.floor((Date.now() - Date.parse(fromIso)) / 1000));
      if (secs < 60) return secs + "s";
      const mins = Math.floor(secs / 60);
      if (mins < 60) return mins + "m";
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + "h " + (mins % 60) + "m";
      const days = Math.floor(hrs / 24);
      return days + "d " + (hrs % 24) + "h";
    }

    function row(k) {
      const s = STATUS[k.status] || STATUS.idle;
      const el = document.createElement("div");
      el.className = "rounded-lg border-l-4 " + s.border + " bg-zinc-900/60 px-4 py-3";
      const syn = (k.synopsis || "").trim();
      el.innerHTML = `
        <div class="flex items-baseline gap-3">
          <span class="text-lg leading-none">${s.icon}</span>
          <span class="font-medium">${escapeHtml(k.name)}</span>
          <span class="text-sm ${s.text}">${s.label}</span>
          <span class="ml-auto text-xs text-zinc-500 tabular-nums">${elapsed(k.last_status_mtime)}</span>
        </div>
        ${syn ? `<p class="synopsis mt-2 text-sm leading-relaxed text-zinc-300">${escapeHtml(syn)}</p>` : ""}
      `;
      return el;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render() {
      if (!lastState) return;
      const kitchens = lastState.kitchens || [];
      const active = kitchens.filter(k => !k.dormant)
        .sort((a, b) => (STATUS[a.status]?.order ?? 9) - (STATUS[b.status]?.order ?? 9)
          || a.name.localeCompare(b.name));
      const dormant = kitchens.filter(k => k.dormant)
        .sort((a, b) => a.name.localeCompare(b.name));

      document.getElementById("counts").textContent =
        `${active.length} active · ${dormant.length} dormant`;

      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      if (active.length === 0) {
        grid.innerHTML = `<p class="text-zinc-500">No active kitchens.</p>`;
      } else {
        active.forEach(k => grid.appendChild(row(k)));
      }

      const wrap = document.getElementById("dormant-wrap");
      const list = document.getElementById("dormant-list");
      if (dormant.length === 0) {
        wrap.classList.add("hidden");
      } else {
        wrap.classList.remove("hidden");
        document.getElementById("dormant-label").textContent =
          `+ ${dormant.length} dormant kitchen${dormant.length === 1 ? "" : "s"} (idle > 24h)`;
        list.innerHTML = "";
        dormant.forEach(k => list.appendChild(row(k)));
      }

      const updated = lastFetch ? Math.floor((Date.now() - lastFetch) / 1000) + "s ago" : "—";
      const next = lastState.next_loop_tick_at
        ? "next loop tick in " + elapsed(lastState.next_loop_tick_at).replace("-", "")
        : "next loop tick: —";
      document.getElementById("status-line").textContent = `Updated ${updated} · ${next}`;
    }

    async function fetchState() {
      try {
        const r = await fetch("/state");
        lastState = await r.json();
        lastFetch = Date.now();
        render();
      } catch (e) {
        document.getElementById("status-line").textContent = "Failed to reach server…";
      }
    }

    // --- WebSocket with exponential backoff (1s → 30s) ---
    let backoff = 1000;
    function setWs(connected) {
      const dot = document.getElementById("ws-dot");
      const txt = document.getElementById("ws-text");
      dot.className = "inline-block h-1.5 w-1.5 rounded-full " +
        (connected ? "bg-emerald-400 live" : "bg-zinc-600");
      txt.textContent = connected ? "live" : "reconnecting…";
    }
    function connectWS() {
      const ws = new WebSocket(`ws://${location.host}/events`);
      ws.onopen = () => { backoff = 1000; setWs(true); };
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === "loop_tick") fetchState();
        } catch (_) {}
      };
      ws.onclose = () => {
        setWs(false);
        setTimeout(connectWS, backoff);
        backoff = Math.min(backoff * 2, 30000);
      };
      ws.onerror = () => ws.close();
    }

    // Re-render once a second so "updated Xs ago" and elapsed times stay live.
    setInterval(render, 1000);

    fetchState();
    connectWS();

    document.getElementById("dormant-toggle").addEventListener("click", () => {
      document.getElementById("dormant-list").classList.toggle("hidden");
    });
  </script>
</body>
</html>
