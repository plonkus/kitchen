<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>kitchen dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ──────────────────────────────────────────────────────────────
   overview · VARIANT A — calm, boxless, single-accent (terracotta).
   Aesthetic preserved verbatim from the picked mockup (claude-1-r3):
   warm paper, Fraunces + Hanken Grotesk, status-grouping spine.
   Every "Waiting on you" item shows its ask + ≤3 static action steps.
   Fully static — the only interaction is the dormant show/hide toggle.
   ────────────────────────────────────────────────────────────── */
:root{
  --paper:#f7f4ee;
  --ink:#23211c;
  --ink-2s:#565148;          /* secondary text */
  --muted:#938c7f;
  --faint:#d9d2c5;
  --accent:#c2410c;          /* terracotta — the only color that means "needs you" */
  --sans:'Hanken Grotesk',system-ui,sans-serif;
  --serif:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh;
}
::selection{background:var(--accent);color:var(--paper)}

.page{max-width:660px; margin:0 auto; padding:68px 30px 140px}

/* ───────── header ───────── */
.head{
  display:flex; justify-content:space-between; align-items:baseline;
  padding-bottom:18px; border-bottom:1px solid var(--faint); margin-bottom:8px;
}
.head .mark{font-family:var(--serif); font-style:italic; font-size:17px; color:var(--ink); letter-spacing:.01em}
.head .clock{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; letter-spacing:.04em}

/* ───────── groups ───────── */
.group{margin-top:46px}
.group:first-of-type{margin-top:34px}
.g-label{
  font-size:10.5px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
  color:var(--muted); margin-bottom:18px;
}
.group.you .g-label{color:var(--accent)}

/* ───────── WAITING ON YOU — every item expanded, static ───────── */
.w-item{
  padding-left:16px; margin-bottom:26px;
  animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards;     /* one-time load reveal (ambient) */
}
.w-item:last-child{margin-bottom:4px}
.w-top{display:flex; justify-content:space-between; align-items:baseline; gap:14px}
.w-name{
  font-family:var(--serif); font-size:18.5px; font-weight:500; color:var(--ink);
  letter-spacing:.005em; display:flex; align-items:baseline; gap:10px; min-width:0; margin-left:-16px;
}
.dot{
  width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0;
  transform:translateY(-2px);
}
.w-time{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; letter-spacing:.03em; flex-shrink:0}
.w-block{
  font-size:14px; color:var(--ink-2s); margin-top:4px; line-height:1.5; max-width:54ch;
}
.w-actions{list-style:none; margin-top:9px}
.w-actions li{
  font-size:13.5px; color:var(--ink-2s); padding:5px 0 0 22px; position:relative; line-height:1.45;
}
.w-actions li:first-child{padding-top:0}
.w-actions li::before{
  content:'→'; position:absolute; left:0; color:var(--accent); opacity:.6; font-size:13px; top:5px;
}
.w-actions li:first-child::before{top:0}
.w-actions .v{color:var(--accent); font-weight:600}

.empty{
  font-family:var(--serif); font-style:italic; font-size:16px; color:var(--muted); padding:6px 0 2px;
}

/* ───────── quiet groups (working / booting / idle) — static one-liners ───────── */
.q-item{
  display:flex; align-items:baseline; gap:14px; padding:7px 0;
  animation:fade .6s ease backwards;
}
.q-name{
  font-family:var(--serif); font-size:15px; font-weight:400; color:var(--ink);
  flex-shrink:0; max-width:46%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.q-line{
  font-size:13px; color:var(--muted); flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.q-time{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; flex-shrink:0}

/* booting gets a faint pulse on the name to feel "in transit" (ambient) */
.q-item.boot .q-name::after{
  content:''; display:inline-block; width:5px; height:5px; border-radius:50%;
  background:var(--muted); margin-left:8px; vertical-align:middle; animation:blink 1.6s ease-in-out infinite;
}

/* ───────── dormant (the one allowed navigational toggle) ───────── */
.dormant{margin-top:54px; padding-top:22px; border-top:1px solid var(--faint)}
.dorm-toggle{
  background:none; border:none; cursor:pointer; font-family:var(--sans);
  font-size:12px; color:var(--muted); letter-spacing:.04em; display:inline-flex; align-items:center; gap:8px;
  padding:2px 0; transition:color .15s;
}
.dorm-toggle:hover{color:var(--ink-2s)}
.dorm-toggle .c{font-size:11px; transition:transform .24s ease; display:inline-block}
.dorm-toggle.open .c{transform:rotate(180deg)}
.dorm-list{
  max-height:0; opacity:0; overflow:hidden; transition:max-height .4s ease, opacity .3s ease;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:2px 22px;
}
.dorm-list.open{max-height:600px; opacity:1; margin-top:16px}
.dorm-row{display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:12.5px}
.dorm-row .n{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dorm-row .a{color:var(--faint); font-variant-numeric:tabular-nums; flex-shrink:0}

/* ───────── motion ───────── */
@keyframes rise{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0} to{opacity:1}}
@keyframes blink{0%,100%{opacity:.25} 50%{opacity:.9}}

@media (max-width:560px){
  .page{padding:48px 22px 100px}
  .q-name{max-width:none}
  .q-line{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<main class="page">

  <header class="head">
    <span class="mark">overview</span>
    <span class="clock" id="clock">—:—</span>
  </header>

  <section class="group you">
    <div class="g-label">Waiting on you</div>
    <div id="waiting"></div>
  </section>

  <div id="quiet"></div>

  <div class="dormant" id="dormant-wrap" style="display:none">
    <button class="dorm-toggle" id="dormToggle">
      <span class="c">⌄</span><span id="dormLabel"></span>
    </button>
    <div class="dorm-list" id="dormList"></div>
  </div>

</main>

<script>
/* ══════════════════════════════════════════════════════════════
   Variant A wired to live /state. No sample data: fetch('/state') on
   load, re-fetch on each `loop_tick` over ws://…/events. The server
   (§3) returns kitchens already sorted (waiting by urgency→oldest;
   others by name) — we bucket by `dormant` then `status` and render
   in the order given. No client-side re-sort: one source of truth.

   Every /state-derived string (name/line/block/actions) is LLM- and
   transcript-authored → UNTRUSTED. All of it is escaped before DOM
   insertion (hard requirement): `<`, `&`, quotes render as text.
   ══════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Relative timestamp from an ISO mtime (the muted, right-aligned timer).
function fmtAge(iso){
  if(!iso) return '';
  const s = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000));
  if(s < 5) return 'now'; if(s < 60) return s + 's';
  const m = (s/60)|0; if(m < 60) return m + 'm';
  const h = (m/60)|0; if(h < 24) return h + 'h'; return ((h/24)|0) + 'd';
}

// First word of an action → accent verb; both halves escaped (untrusted).
function verbify(a){
  const sp = a.indexOf(' ');
  if(sp === -1) return escapeHtml(a);
  return `<span class="v">${escapeHtml(a.slice(0, sp))}</span>${escapeHtml(a.slice(sp))}`;
}

let lastState = null;

/* ───────── Waiting on you — every item expanded, static ───────── */
function renderWaiting(items){
  const wrap = $('#waiting');
  if(!items.length){ wrap.innerHTML = `<p class="empty">Nothing needs you right now.</p>`; return; }
  wrap.innerHTML = items.map((k,i)=>`
    <div class="w-item" style="animation-delay:${(i*.07).toFixed(2)}s">
      <div class="w-top">
        <span class="w-name"><span class="dot"></span>${escapeHtml(k.name)}</span>
        <span class="w-time" data-age="${escapeHtml(k.last_status_mtime)}">${fmtAge(k.last_status_mtime)}</span>
      </div>
      <p class="w-block">${escapeHtml(k.block || '')}</p>
      <ul class="w-actions">${(k.actions || []).slice(0,3).map(a=>`<li>${verbify(a)}</li>`).join('')}</ul>
    </div>`).join('');
}

/* ───────── quiet groups (working / booting / idle) — one-line `line` ───────── */
function group(items, label, boot){
  if(!items.length) return '';
  return `<section class="group"><div class="g-label">${label}</div>${
    items.map((k,i)=>`
      <div class="q-item ${boot?'boot':''}" style="animation-delay:${(i*.05).toFixed(2)}s">
        <span class="q-name">${escapeHtml(k.name)}</span>
        <span class="q-line">${escapeHtml(k.line || '')}</span>
        <span class="q-time" data-age="${escapeHtml(k.last_status_mtime)}">${fmtAge(k.last_status_mtime)}</span>
      </div>`).join('')
  }</section>`;
}
function renderQuiet(active){
  const of = s => active.filter(k=>k.status===s);   // /state order preserved, no re-sort
  $('#quiet').innerHTML =
    group(of('working'),'Working') +
    group(of('booting'),'Booting', true) +
    group(of('idle'),'Idle');
}

/* ───────── dormant drawer (hidden entirely when empty) ───────── */
function renderDormant(items){
  const wrap = $('#dormant-wrap');
  if(!items.length){ wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  $('#dormLabel').textContent = items.length + ' dormant';
  $('#dormList').innerHTML = items.map(k=>
    `<div class="dorm-row"><span class="n">${escapeHtml(k.name)}</span>` +
    `<span class="a" data-age="${escapeHtml(k.last_status_mtime)}">${fmtAge(k.last_status_mtime)}</span></div>`).join('');
}

/* Bucket by the `dormant` flag first (→ drawer), then by `status`. §3
   guarantees a waiting_on_you kitchen is never dormant, so it always
   lands in Waiting, never the drawer. */
function render(){
  if(!lastState) return;
  const kitchens = lastState.kitchens || [];
  const active = kitchens.filter(k=>!k.dormant);
  renderWaiting(active.filter(k=>k.status === 'waiting_on_you'));
  renderQuiet(active);
  renderDormant(kitchens.filter(k=>k.dormant));
}

async function fetchState(){
  try{
    const r = await fetch('/state');
    lastState = await r.json();
    render();
  }catch(e){ /* keep the last-rendered state; the WS reconnect re-triggers a fetch */ }
}

/* ───────── ambient liveness: ticking clock + elapsed timers (not interaction) ───────── */
function tick(){
  const d = new Date();
  $('#clock').textContent = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  document.querySelectorAll('[data-age]').forEach(el=>{ el.textContent = fmtAge(el.dataset.age); });
}

/* ───────── WebSocket: re-fetch /state on loop_tick (reconnect/backoff 1s→30s) ───────── */
let backoff = 1000;
function connectWS(){
  const ws = new WebSocket(`ws://${location.host}/events`);
  ws.onopen = () => { backoff = 1000; };
  ws.onmessage = (ev) => {
    try{ if(JSON.parse(ev.data).type === 'loop_tick') fetchState(); }catch(_){}
  };
  ws.onclose = () => { setTimeout(connectWS, backoff); backoff = Math.min(backoff*2, 30000); };
  ws.onerror = () => ws.close();
}

/* ───────── the one allowed toggle: show/hide dormant ───────── */
const dt = $('#dormToggle'), dl = $('#dormList');
dt.addEventListener('click', ()=>{ dt.classList.toggle('open'); dl.classList.toggle('open'); });

fetchState();
connectWS();
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
